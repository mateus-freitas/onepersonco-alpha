<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Person Company — alpha</title>
<script>
  // Internal tool: dark by default. The header toggle still switches themes per visit.
  document.documentElement.classList.add("dark");
</script>
<link rel="stylesheet" href="global.css">
<style>
  /* console-only layout on top of global.css; all colors come from theme tokens */
  .wrap{max-width:1180px;margin:0 auto;padding:20px 20px 36px;display:flex;flex-direction:column;gap:16px}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{font-size:14px;margin:0;font-weight:600;letter-spacing:-.01em}
  .pill{font-size:10px;border:1px solid var(--border);border-radius:var(--radius);padding:2px 8px;color:var(--muted-foreground)}
  .sub{color:var(--muted-foreground);font-size:11px}
  header .right{margin-left:auto;display:flex;gap:6px;align-items:center}
  .btn{font:inherit;font-size:11.5px;padding:5px 10px;border:1px solid var(--border);background:transparent;color:var(--foreground);border-radius:var(--radius);cursor:pointer}
  .btn:hover{background:var(--accent);color:var(--accent-foreground)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;border:1px solid var(--border);border-radius:var(--radius);padding:4px 10px;color:var(--muted-foreground);cursor:pointer;background:transparent}
  .chip:hover{background:var(--accent);color:var(--accent-foreground)}
  .chip.on{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
  .chip.on .dot{background:currentColor;border-color:currentColor}
  .dot{display:inline-block;width:6px;height:6px;border-radius:999px;flex:none}
  .pa{background:var(--project-1)} .pb{background:var(--project-2)} .pc{background:var(--project-3)}
  .pd{background:var(--project-4)} .pe{background:var(--project-5)}
  .tabs{display:flex;gap:2px;background:var(--muted);padding:3px;border-radius:var(--radius);width:max-content;max-width:100%;flex-wrap:wrap}
  .tab{font:inherit;font-size:12px;padding:5px 12px;border-radius:var(--radius);border:none;background:transparent;color:var(--muted-foreground);cursor:pointer}
  .tab:hover{color:var(--foreground)}
  .tab.on{background:var(--background);color:var(--foreground);font-weight:500;box-shadow:0 1px 2px rgb(0 0 0 / .06)}
  .tab .n{font-size:10px;margin-left:5px;opacity:.7}
  .n.danger{color:var(--destructive)}
  .banner{border:1px dashed var(--border);border-radius:var(--radius);padding:10px 14px;color:var(--muted-foreground);font-size:12px}
  .banner b{color:var(--foreground)}
  .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media (max-width:680px){.cols{grid-template-columns:repeat(2,1fr)}}
  .col{border:1px solid var(--border);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:80px;background:var(--card)}
  .col .hd{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground);display:flex;gap:6px;align-items:center}
  .col .hd em{font-style:normal;font-weight:400;opacity:.7}
  .card{border:1px solid var(--border);border-radius:var(--radius);padding:9px 10px;background:var(--background);font-size:12px}
  .card .t{line-height:1.4}
  .card .meta{display:flex;gap:6px;align-items:center;color:var(--muted-foreground);font-size:10.5px;margin-top:6px;flex-wrap:wrap}
  .card.done{opacity:.55}
  .card.done .t{text-decoration:line-through}
  .tag{font-size:9.5px;border:1px solid var(--border);border-radius:var(--radius);padding:1px 6px;color:var(--muted-foreground)}
  .tag.solid{background:var(--secondary);border-color:transparent;color:var(--secondary-foreground)}
  .tag.danger{color:var(--destructive);border-color:color-mix(in srgb, var(--destructive) 45%, transparent)}
  .oplink{color:inherit;text-decoration:none;border-bottom:1px dotted transparent;cursor:pointer}
  .oplink:hover{border-bottom-color:var(--border)}
  #toast{position:fixed;right:16px;bottom:16px;background:var(--card);border:1px solid var(--border);color:var(--foreground);font-size:12px;padding:8px 12px;border-radius:var(--radius);opacity:0;transition:opacity .15s;pointer-events:none}
  #toast.on{opacity:1}
  .list{display:flex;flex-direction:column;gap:8px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-foreground);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);font-weight:600}
  td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
  td.mono{font-size:10.5px;color:var(--muted-foreground)}
  .empty{color:var(--muted-foreground);font-size:12px;padding:8px 2px}
  .sessions{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
  .group-hd{color:var(--muted-foreground);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin:4px 0 8px;display:flex;align-items:center;gap:6px}
  footer{color:var(--muted-foreground);font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>One Person Company <span class="pill">alpha</span></h1>
    <span class="sub" id="gen"></span>
    <span class="right">
      <button class="btn" id="theme" title="Toggle light / dark">◐ theme</button>
      <button class="btn" id="rescan" style="display:none">rescan</button>
    </span>
  </header>
  <nav class="chips" id="chips"></nav>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
  <footer id="foot"></footer>
</div>
<!--__DATA__-->
<script>
const $ = (s, el = document) => el.querySelector(s);
let DATA = window.__DATA__ || null;
const state = { tab: "board", project: "all" };
const pcls = new Map();
const pclass = (id) => { if (!pcls.has(id)) pcls.set(id, ["pa", "pb", "pc", "pd", "pe"][pcls.size % 5]); return pcls.get(id); };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const icon = (ok) => ok ? "☑" : "☐";
const LIVE = !window.__DATA__;
let toastTimer = null;
function toast(msg) {
  let el = document.getElementById("toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 1600);
}
function absPath(baseDir, rel) {
  if (!rel) return null;
  if (rel.startsWith("~/")) return DATA.home ? DATA.home + rel.slice(1) : null;
  return baseDir ? baseDir + "/" + rel : null;
}
function opLink(text, path, tip) {
  if (!LIVE || !path) return esc(text);
  return '<a class="oplink" href="/open?path=' + encodeURIComponent(path) + '" title="' + esc(tip || "Open " + path) + '">' + esc(text) + "</a>";
}

const filtered = () => state.project === "all" ? DATA.projects : DATA.projects.filter((p) => p.id === state.project);
const backlogOf = (p) => p.backlog || { Now: [], Next: [], Later: [], Done: [] };
const docsOf = (p) => p.docs || [];
const allDocs = () => filtered().flatMap((p) => docsOf(p).map((d) => ({ ...d, project: p.id, projectPath: p.path })));
const sessionsOf = (p) => p.promptSessions || [];
const allSessions = () => filtered().flatMap((p) => sessionsOf(p).map((s) => ({ ...s, project: p.id })));

function chip(id, name, extra) {
  return '<span class="chip' + (state.project === id ? " on" : "") + '" data-project="' + id + '">' +
    (id === "all" ? "" : '<span class="dot ' + pclass(id) + '"></span>') + esc(name) +
    (extra ? ' <span class="tag">' + esc(extra) + "</span>" : "") + "</span>";
}

function renderChips() {
  $("#chips").innerHTML = chip("all", "All") +
    DATA.projects.map((p) => chip(p.id, p.id, !p.exists ? "missing" : !p.backlog ? "pending retrofit" : null)).join("");
}

function renderTabs() {
  const rfcCount = allDocs().filter((d) => ["rfc", "adr"].includes(d.type)).length;
  const tabs = [["board", "Board"], ["rfcs", "RFCs", rfcCount], ["docs", "Docs", allDocs().length], ["prompts", "Prompts", allSessions().length]];
  if (DATA.health) {
    const errors = DATA.health.errors || 0;
    tabs.push(["health", "Health", errors + (DATA.health.warnings || 0), errors > 0 ? " danger" : ""]);
  }
  $("#tabs").innerHTML = tabs.map(([id, label, n, cls]) =>
    '<button class="tab' + (state.tab === id ? " on" : "") + '" data-tab="' + id + '">' + label +
    (n ? '<span class="n' + (cls || "") + '">' + esc(n) + "</span>" : "") + "</button>").join("");
}

function renderBoard() {
  const pending = filtered().filter((p) => !p.exists || !p.backlog);
  const banner = pending.length
    ? '<div class="banner">' + pending.map((p) => "<b>" + esc(p.id) + "</b>" + (p.exists
      ? ' — registered, waiting for its retrofit (no <span class="mono">docs/backlog.md</span> yet)'
      : " — path missing")).join("<br>") + "</div>"
    : "";
  const h = DATA.health;
  const healthBanner = h && h.errors > 0
    ? '<div class="banner">opc check reports <b>' + esc(h.errors) + (Number(h.errors) === 1 ? " error" : " errors") + "</b> — open the Health tab</div>"
    : "";
  const cols = ["Now", "Next", "Later", "Done"].map((s) => {
    const items = filtered().flatMap((p) => backlogOf(p)[s].map((i) => ({ ...i, project: p.id, projectPath: p.path })));
    const cards = items.length ? items.map((i) => {
      const meta = [
        '<span class="dot ' + pclass(i.project) + '"></span>' + esc(i.project),
        i.spec ? '<span class="tag">' + opLink("spec ↗", absPath(i.projectPath, i.spec)) + "</span>" : "",
        i.priority ? '<span class="tag">' + esc(i.priority) + "</span>" : "",
        i.date ? '<span class="tag">' + esc(i.date) + "</span>" : "",
      ].filter(Boolean).join(" ");
      return '<div class="card' + (i.checked ? " done" : "") + '"><div class="t">' + icon(i.checked) + " " + esc(i.title) + '</div><div class="meta">' + meta + "</div></div>";
    }).join("") : '<div class="empty">—</div>';
    return '<div class="col"><div class="hd">' + s + " <em>" + items.length + "</em></div>" + cards + "</div>";
  }).join("");
  return healthBanner + banner + '<div class="cols">' + cols + "</div>";
}

function renderRfcs() {
  const items = allDocs().filter((d) => ["rfc", "adr"].includes(d.type));
  if (!items.length) return '<div class="empty">No RFCs or ADRs with the 4-line header yet.</div>';
  return '<div class="list">' + items.map((d) =>
    '<div class="card"><div class="t"><span class="tag">' + esc((d.type || "").toUpperCase()) + "</span> " + esc(d.title) + "</div>" +
    '<div class="meta"><span class="dot ' + pclass(d.project) + '"></span>' + esc(d.project) +
    ' <span class="tag' + (["accepted", "done"].includes(d.status) ? " solid" : "") + '">' + esc(d.status || "?") + "</span>" +
    (d.date ? " <span class=\"tag\">" + esc(d.date) + "</span>" : "") + ' <span class="mono">' + opLink(d.file, absPath(d.projectPath, d.file)) + "</span></div></div>").join("") + "</div>";
}

function renderDocs() {
  const items = allDocs();
  if (!items.length) return '<div class="empty">No docs with the 4-line header yet.</div>';
  return "<table><thead><tr><th>project</th><th>type</th><th>status</th><th>date</th><th>title</th><th>path</th></tr></thead><tbody>" +
    items.map((d) => "<tr><td class='mono'><span class='dot " + pclass(d.project) + "'></span> " + esc(d.project) + "</td><td>" + esc(d.type || "") + "</td><td>" + esc(d.status || "") + "</td><td class='mono'>" + esc(d.date || "") + "</td><td>" + esc(d.title) + "</td><td class='mono'>" + opLink(d.file, absPath(d.projectPath, d.file)) + "</td></tr>").join("") +
    "</tbody></table>";
}

function renderPrompts() {
  const groups = filtered().map((p) => {
    const sessions = sessionsOf(p);
    const legacy = p.legacyInRepoPrompts || p.legacyPromptFiles;
    const legacyNote = legacy ? '<div class="empty">' + legacy + " legacy prompt file(s) still inside the repo — move to scratch at retrofit</div>" : "";
    const cards = sessions.map((s) => {
      const age = Math.round((Date.now() - new Date(s.mtime + "T12:00:00").getTime()) / 86400000);
      const stale = age > 7 ? ' <span class="tag danger">stale ' + age + "d</span>" : "";
      return '<div class="card"><div class="t">📁 ' + opLink(s.name, s.path) + '</div><div class="meta"><span class="mono">' + s.files + " file(s)" + (s.date ? " · " + esc(s.date) : "") + "</span>" + stale + "</div></div>";
    }).join("");
    if (!sessions.length && !legacyNote) return "";
    return '<div><div class="group-hd"><span class="dot ' + pclass(p.id) + '"></span>' + esc(p.id) + '</div><div class="sessions">' + (cards || '<div class="empty">no active sessions in scratch</div>') + "</div>" + legacyNote + "</div>";
  }).join("");
  return groups || '<div class="empty">No active prompt sessions in scratch.</div>';
}

function renderHealth() {
  const findings = (DATA.health && DATA.health.findings) || [];
  if (!findings.length) return '<div class="empty">checks clean</div>';
  const groups = filtered().map((p) => {
    const items = findings.filter((f) => f.project === p.id);
    if (!items.length) return "";
    const cards = items.map((f) => {
      const proj = DATA.projects.find((x) => x.id === f.project);
      const file = f.file && proj ? '<div class="meta"><span class="mono">' + opLink(f.file, absPath(proj.path, f.file)) + "</span></div>" : "";
      return '<div class="card"><div class="t"><span class="' + (f.level === "error" ? "tag danger" : "tag") + '">' + esc(f.level) +
        '</span> <span class="mono">' + esc(f.code) + "</span> " + esc(f.message) + "</div>" + file + "</div>";
    }).join("");
    return '<div><div class="group-hd"><span class="dot ' + pclass(p.id) + '"></span>' + esc(p.id) + '</div><div class="list">' + cards + "</div></div>";
  }).join("");
  return groups || '<div class="empty">no findings for the selected projects</div>';
}

function renderFoot() {
  $("#foot").textContent = (window.__DATA__ ? "snapshot — run `opc console` for the live console · " : "live · data rescans on every load · click paths to open locally · ") +
    filtered().map((p) => p.id + (p.branch ? "@" + p.branch : "") + (p.dirty ? " ✎" + p.dirty : "")).join("  ·  ");
}

function render() {
  if (!DATA) return;
  $("#gen").textContent = "generated " + new Date(DATA.generatedAt).toLocaleString();
  if (state.tab === "health" && !DATA.health) state.tab = "board";
  renderChips();
  renderTabs();
  const views = { board: renderBoard, rfcs: renderRfcs, docs: renderDocs, prompts: renderPrompts };
  if (DATA.health) views.health = renderHealth;
  $("#view").innerHTML = views[state.tab]();
  renderFoot();
  document.getElementById("rescan").style.display = window.__DATA__ ? "none" : "";
}

document.addEventListener("click", (e) => {
  const link = e.target.closest("a.oplink");
  if (link) {
    e.preventDefault();
    fetch(link.getAttribute("href"))
      .then((r) => toast(r.ok ? "opened" : "not found"))
      .catch(() => toast("could not open"));
    return;
  }
  const chipEl = e.target.closest("[data-project]");
  if (chipEl) { state.project = chipEl.dataset.project; render(); return; }
  const tabEl = e.target.closest("[data-tab]");
  if (tabEl) { state.tab = tabEl.dataset.tab; render(); return; }
  if (e.target.id === "theme") { document.documentElement.classList.toggle("dark"); return; }
  if (e.target.id === "rescan") { DATA = null; load(); }
});

async function load() {
  if (!DATA) {
    try { DATA = await (await fetch("./data.json", { cache: "no-store" })).json(); }
    catch (err) { $("#view").innerHTML = '<div class="empty">data.json not readable — run `opc scan` first</div>'; return; }
  }
  pcls.clear();
  render();
}
load();
</script>
</body>
</html>
